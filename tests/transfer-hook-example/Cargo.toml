# Counter transfer-hook fixture for the integration tests. Standalone
# workspace: the cdylib entrypoint emits BPF-only items host builds must skip.
[workspace]

[package]
name = "transfer-hook-example"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11.1", features = ["cpi"] }
transfer-hook-common = { path = "../transfer-hook-common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
